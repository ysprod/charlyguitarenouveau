<div class="method-container">

  <!-- ═══════════════════════════════════════════════════════
       BANNIÈRE TUTORIELS VIDÉO
       ═══════════════════════════════════════════════════════ -->
  <section class="tutorial-section" aria-label="Tutoriels vidéo">
    <a
      class="tutorial-banner"
      href="https://youtube.com/playlist?list=PLY4Ohx8IPP3I9A8MWl46aKoG_iQQA5OF0&si=a32R3wUYAWUBbuj7"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Voir la playlist de tutoriels vidéo sur YouTube"
    >
      <span class="tutorial-glow" aria-hidden="true"></span>

      <span class="tutorial-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </span>

      <span class="tutorial-content">
        <span class="tutorial-subtitle">
       Chaque dimension en vidéo
        </span>
      </span>

      <span class="tutorial-cta">
        <span class="tutorial-cta-text">Voir la playlist</span>
        <svg class="tutorial-arrow" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </span>

      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>
    </a>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       GRILLE DES DIMENSIONS
       ═══════════════════════════════════════════════════════ -->
  <main class="dimensions-grid">
    @for (dim of dimensions; track dim.nom) {
      <a
        [routerLink]="dim.route"
        class="dimension-card"
        [style.--accent]="dim.couleur"
        [style.--accent-light]="dim.couleurSecondaire"
        [attr.title]="'Dimension ' + dim.nom + ' — ' + dim.sage"
        [attr.aria-label]="'Explorer la dimension ' + dim.nom + ', gardée par ' + dim.sage"
      >
        <div class="card-halo" aria-hidden="true"></div>
        <div class="card-top-band" aria-hidden="true"></div>

        <div class="card-content">
          <header class="dimension-header">
            <div class="dimension-symbol" aria-hidden="true">
              {{ dim.symbole }}
            </div>
            <div class="dimension-title">
              <span class="dimension-name">{{ dim.nom }}</span>
              <span class="dimension-note">{{ dim.note }}</span>
            </div>
          </header>

          <p class="dimension-description">{{ dim.description }}</p>

          <div class="dimension-meta">
            <div class="meta-item">
              <span class="meta-label">Note</span>
              <span class="meta-value">{{ dim.note }}</span>
            </div>
            <div class="meta-divider" aria-hidden="true"></div>
            <div class="meta-item">
              <span class="meta-label">Sage</span>
              <span class="meta-value">{{ dim.sage }}</span>
            </div>
          </div>

          <div class="card-action">
            <span>Explorer</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </div>
        </div>

        <div class="corner-decoration top-left" aria-hidden="true"></div>
        <div class="corner-decoration top-right" aria-hidden="true"></div>
        <div class="corner-decoration bottom-left" aria-hidden="true"></div>
        <div class="corner-decoration bottom-right" aria-hidden="true"></div>
      </a>
    }
  </main>
</div>
