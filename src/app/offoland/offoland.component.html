<div class="offoland-app">

  <!-- ═══════════════════════════════════════════════════════
       HERO — PORTAIL VERS OFFOLAND
       ═══════════════════════════════════════════════════════ -->
  <section class="hero-section">

    <!-- 🌌 Particules animées -->
    <div class="particles-bg" aria-hidden="true">
      @for (p of particles; track p) {
        <span class="particle"
              [style.left.%]="p * 4.3 % 100"
              [style.animation-delay]="p * 0.4 + 's'"
              [style.animation-duration]="7 + (p % 6) + 's'"></span>
      }
    </div>

    <!-- 🔮 Aura lumineuse -->
    <div class="hero-aura" aria-hidden="true">
      <div class="aura aura-1"></div>
      <div class="aura aura-2"></div>
      <div class="aura aura-3"></div>
    </div>

    <!-- 📜 Contenu -->
    <div class="hero-content">

      <span class="hero-eyebrow">
        <span class="eyebrow-dot"></span>
       OFFOLAND
      </span> 

      <div class="hero-divider">
        <span class="line"></span>
        <span class="icon">🌌</span>
        <span class="line"></span>
      </div> 
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       SECTIONS ENFANTS
       ═══════════════════════════════════════════════════════ -->
  <main class="main-content">
    <section class="section-wrapper" appReveal>
      <app-play></app-play>
    </section>

    <section class="section-wrapper" appReveal>
      <app-charlyguitaregame></app-charlyguitaregame>
    </section>
  </main>

</div>
