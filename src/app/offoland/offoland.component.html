<!-- src/app/offoland/offoland.component.html -->

<div class="offoland-app">

  <!-- ═══════════════════════════════════════════════════════
       HERO — LE PORTAIL D'OFFOLAND
       ═══════════════════════════════════════════════════════ -->
  <section class="hero-section" aria-labelledby="offoland-title">

    <!-- 🌌 Sept couleurs primordiales en auras -->
    <div class="hero-aura" aria-hidden="true">
      <div class="aura aura-do"></div>
      <div class="aura aura-re"></div>
      <div class="aura aura-mi"></div>
      <div class="aura aura-fa"></div>
      <div class="aura aura-sol"></div>
      <div class="aura aura-la"></div>
      <div class="aura aura-si"></div>
    </div>

    <!-- 🥁 Battement du Premier Tambour -->
    <div class="premier-tambour" aria-hidden="true">
      <span class="pulse-ring ring-1"></span>
      <span class="pulse-ring ring-2"></span>
      <span class="pulse-ring ring-3"></span>
    </div>

    <!-- 📜 Contenu sacré -->
    <div class="hero-content">

      <!-- 🌟 Titre principal -->
      <h1 id="offoland-title" class="hero-title">
        <span class="hero-title-gold">OFFOLAND</span>
      </h1>

      <!-- ═══════════════════════════════════════════════════════
           SECTION — Accès aux dimensions (TON ORDRE)
           ═══════════════════════════════════════════════════════ -->
      <main class="main-content">
        <section class="section-wrapper" aria-label="Accéder aux dimensions">
          <div class="dimensions-cta">
            <div class="cta-icon" aria-hidden="true">🌌</div>
            <h2 class="cta-title">Explore les Sept Dimensions</h2>
         
            <a routerLink="/offoland/dimensions/charlyguitaregame" class="cta-button">
              <span>Entrer dans les dimensions</span>
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </a>
          </div>
        </section>
      </main> 

      <!-- 🌈 Divider sacré -->
      <div class="hero-divider">
        <span class="line" aria-hidden="true"></span>
        <span class="icon" aria-hidden="true">🥁</span>
        <span class="line" aria-hidden="true"></span>
      </div>

      <!-- 🏦 Portails -->
      <div class="portails-grid">
        @for (portail of portails; track portail.id) {

        @if (portail.route) {
        <a class="portail-btn" [class]="'portail-btn ' + portail.cssClass" [routerLink]="portail.route"
          [attr.aria-label]="'Accéder à ' + portail.label + ' — ' + portail.sub">
          <span class="portail-glow" aria-hidden="true"></span>
          <span class="portail-icon" aria-hidden="true">{{ portail.icon }}</span>
          <span class="portail-label">{{ portail.label }}</span>
          <span class="portail-sub">{{ portail.sub }}</span>
        </a>
        } @else {
        <div class="portail-btn portail-locked" aria-disabled="true"
          [attr.aria-label]="'Portail verrouillé : ' + portail.label + ' — Bientôt disponible'">
          <span class="portail-icon" aria-hidden="true">{{ portail.icon }}</span>
          <span class="portail-label">{{ portail.label }}</span>
          <span class="portail-sub">{{ portail.sub }}</span>
          <span class="portail-lock" aria-hidden="true">🔒</span>
        </div>
        }

        }
      </div>

    </div>

  </section>

</div>
