<!-- src/app/offoland/offoland.component.html -->

<div class="offoland-app">

  <section class="hero-section" aria-labelledby="offoland-title">

    <!-- Auras -->
    <div class="hero-aura" aria-hidden="true">
      <div class="aura aura-do"></div>
      <div class="aura aura-re"></div>
      <div class="aura aura-mi"></div>
      <div class="aura aura-fa"></div>
      <div class="aura aura-sol"></div>
      <div class="aura aura-la"></div>
      <div class="aura aura-si"></div>
    </div>

    <!-- Premier Tambour -->
    <div class="premier-tambour" aria-hidden="true">
      <span class="pulse-ring ring-1"></span>
      <span class="pulse-ring ring-2"></span>
      <span class="pulse-ring ring-3"></span>
    </div>

    <div class="hero-content">

      <h1 id="offoland-title" class="hero-title">
        <span class="hero-title-gold">OFFOLAND</span>
      </h1>

      <!-- ═══════════════════════════════════════════════════════
           DOUBLE CTA — Dimensions & Vie d'Offoland
           ═══════════════════════════════════════════════════════ -->
      <main class="main-content">
        <section class="hub-grid" aria-label="Explorer Offoland">


          <!-- 🌍 Vie d'Offoland -->
          <a
            routerLink="/offoland/vie"
            class="hub-card hub-card--vie"
            aria-label="Explorer la Vie d'Offoland"
          >
            <div class="hub-glow" aria-hidden="true"></div>
            <div class="hub-band" aria-hidden="true"></div>

            <div class="hub-icon" aria-hidden="true">🌍</div>

            <div class="hub-body">
              <h2 class="hub-title">Offoland City</h2>
              <p class="hub-subtitle">Banque, Finance et institutions, Charte etc...</p>
            </div>

            <span class="hub-cta">
              <span>Explorer</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </span>

            <span class="corner corner-tl" aria-hidden="true"></span>
            <span class="corner corner-tr" aria-hidden="true"></span>
            <span class="corner corner-bl" aria-hidden="true"></span>
            <span class="corner corner-br" aria-hidden="true"></span>
          </a>

          <!-- 🌌 Dimensions -->
          <a
            routerLink="/offoland/dimensions/charlyguitaregame"
            class="hub-card hub-card--dimensions"
            aria-label="Explorer les Sept Dimensions"
          >
            <div class="hub-glow" aria-hidden="true"></div>
            <div class="hub-band" aria-hidden="true"></div>

            <div class="hub-icon" aria-hidden="true">🌌</div>

            <div class="hub-body">
              <h2 class="hub-title">Les Sept Dimensions</h2>
              <p class="hub-subtitle">Explore les 7 royaumes d'Offoland</p>
            </div>

            <span class="hub-cta">
              <span>Entrer</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </span>

            <span class="corner corner-tl" aria-hidden="true"></span>
            <span class="corner corner-tr" aria-hidden="true"></span>
            <span class="corner corner-bl" aria-hidden="true"></span>
            <span class="corner corner-br" aria-hidden="true"></span>
          </a>
        </section>
      </main>
    </div>

  </section>
   <app-immersive-carousel />
</div>
