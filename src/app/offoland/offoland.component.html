<div class="offoland-app">

  <!-- ═══════════════════════════════════════════════════════
       HERO — LE PORTAIL D'OFFOLAND
       ═══════════════════════════════════════════════════════ -->
  <section class="hero-section">

    <!-- 🌌 Sept couleurs primordiales en auras tournantes -->
    <div class="hero-aura" aria-hidden="true">
      <div class="aura aura-do"></div>  <!-- Blanc    -->
      <div class="aura aura-re"></div>  <!-- Rouge    -->
      <div class="aura aura-mi"></div>  <!-- Vert     -->
      <div class="aura aura-fa"></div>  <!-- Bleu     -->
      <div class="aura aura-sol"></div> <!-- Noir     -->
      <div class="aura aura-la"></div>  <!-- Pourpre  -->
      <div class="aura aura-si"></div>  <!-- Violet   -->
    </div>

    <!-- 🥁 Battement du Premier Tambour -->
    <div class="premier-tambour" aria-hidden="true">
      <span class="pulse-ring ring-1"></span>
      <span class="pulse-ring ring-2"></span>
      <span class="pulse-ring ring-3"></span>
    </div>

    <!-- 📜 Contenu sacré -->
    <div class="hero-content">

      <!-- 🌟 Titre principal -->
      <h1 class="hero-title">
        <span class="hero-title-gold">OFFOLAND</span>
      </h1>

      <!-- 🎵 Mélodie des Origines (La m – Ré m – Fa M – Sol M) -->
      <div class="melodie-origines">
        <span class="note" style="--note-color: #64748b">La m</span>
        <span class="note-sep" aria-hidden="true">·</span>
        <span class="note" style="--note-color: #dc2626">Ré m</span>
        <span class="note-sep" aria-hidden="true">·</span>
        <span class="note" style="--note-color: #b8860b">Fa M</span>
        <span class="note-sep" aria-hidden="true">·</span>
        <span class="note" style="--note-color: #16a34a">Sol M</span>
      </div>

      <!-- 🌈 Divider sacré -->
      <div class="hero-divider">
        <span class="line" aria-hidden="true"></span>
        <span class="icon" aria-hidden="true">🥁</span>
        <span class="line" aria-hidden="true"></span>
      </div>

      <!-- 🏦 Portails vers les modules -->
      <div class="portails-grid">

        <a class="portail-btn portail-economie" [routerLink]="['/finance']">
          <span class="portail-glow" aria-hidden="true"></span>
          <span class="portail-icon" aria-hidden="true">🏦</span>
          <span class="portail-label">ÉCONOMIE</span>
          <span class="portail-sub">Offo Money · BCO · Marché</span>
        </a>

        <a class="portail-btn portail-banque" [routerLink]="['/bco']">
          <span class="portail-glow" aria-hidden="true"></span>
          <span class="portail-icon" aria-hidden="true">⚖️</span>
          <span class="portail-label">BANQUE CENTRALE</span>
          <span class="portail-sub">Masse monétaire · Réserves</span>
        </a>

      </div>

    </div>

  </section>

  <main class="main-content">  
    <section class="section-wrapper" appReveal>
      <app-charlyguitaregame></app-charlyguitaregame>
    </section>
  </main>

</div>
