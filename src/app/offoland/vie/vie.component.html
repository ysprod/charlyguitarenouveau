<!-- src/app/offoland/vie/vie.component.html -->

<div class="vie-shell">

  <!-- ═══════════════════════════════════════════════════════
       TOOLBAR
       ═══════════════════════════════════════════════════════ -->
  <header class="vie-toolbar">
    <div class="toolbar-left">

      <!-- ✅ Bouton retour conditionnel (masqué sur la page hub) -->
      @if (showBackButton()) {
        <a
          routerLink="/offoland/vie"
          class="btn-back"
          aria-label="Retour au hub Vie d'Offoland"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
          <span>Retour</span>
        </a>
      }

      <!-- Nom de la section -->
      <div class="toolbar-title">
        <span class="title-icon" aria-hidden="true">{{ currentIcon() }}</span>
        <span class="title-text">{{ currentLabel() }}</span>
      </div>

    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════
       CONTENU
       ═══════════════════════════════════════════════════════ -->
  <main class="vie-content">
    <router-outlet />
  </main>

</div>
