<!-- src/app/offoland/components/citation-widget/citation-widget.component.html -->

<div class="citation-card">
  <!-- Décoration parchemin -->
  <div class="scroll-icon" aria-hidden="true">📜</div>
  
  <!-- Contenu de la citation -->
  <div class="citation-content">
    <p class="citation-text">« {{ currentCitation().text }} »</p>
    <p class="citation-author">— {{ currentCitation().author }}</p>
  </div>

  <!-- Bouton pour changer de citation -->
  <button type="button" class="btn-refresh" (click)="nextCitation()" aria-label="Afficher une autre citation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
      <path d="M21 3v5h-5" />
    </svg>
    <span>Nouvelle sagesse</span>
  </button>
</div>
