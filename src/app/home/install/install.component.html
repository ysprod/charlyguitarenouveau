<!-- src/app/home/install/install.component.html -->

@if (visible()) {
  <div class="contact-cta">
    <button
      type="button"
      class="btn-install-app"
      (click)="openModalOrPrompt()"
      aria-label="Installer l'application Charly Guitare"
    >
      <svg
        class="btn-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      <span>Installer l'app</span>
    </button>
  </div>
}

@if (modalOpen()) {
  <div
    class="install-modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="install-modal-title"
    aria-describedby="install-modal-desc"
    (click)="closeModal()"
    (keydown)="onModalKeydown($event)"
    tabindex="-1"
  >
    <div
      #modalCard
      class="install-modal-card"
      role="document"
      (click)="$event.stopPropagation()"
    >
      <button
        #modalCloseBtn
        type="button"
        class="modal-close"
        (click)="closeModal()"
        aria-label="Fermer la fenêtre d'installation"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>

      <h2 id="install-modal-title" class="modal-title">
        Installer Charly Guitare 💻
      </h2>

      <p id="install-modal-desc" class="modal-description">
        Installe Charly Guitare comme application sur ton appareil :
      </p>

      <ol class="modal-steps">
        <li class="step">
          <span class="step-number">1</span>
          <div class="step-body">
            <p class="step-text">
              Repère l'icône d'installation
              <svg
                class="step-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              à droite de la barre d'adresse
            </p>
          </div>
        </li>

        <li class="step">
          <span class="step-number">2</span>
          <div class="step-body">
            <p class="step-text">
              Ou ouvre le menu
              <svg
                class="step-icon"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <circle cx="12" cy="5" r="2" />
                <circle cx="12" cy="12" r="2" />
                <circle cx="12" cy="19" r="2" />
              </svg>
              → « Installer l'app »
            </p>
          </div>
        </li>

        <li class="step">
          <span class="step-number">3</span>
          <div class="step-body">
            <p class="step-text">Confirme « Installer »</p>
          </div>
        </li>
      </ol>

      <button type="button" class="btn-understand" (click)="closeModal()">
        Compris
      </button>
    </div>
  </div>
}
