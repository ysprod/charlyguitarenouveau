<!-- src/app/home/footer/footer.component.html -->

<!-- Bouton d'installation (PWA) -->
<app-install />

<footer class="app-footer">

  <!-- Lueurs de fond (Aurora) -->
  <div class="footer-glow footer-glow--gold" aria-hidden="true"></div>
  <div class="footer-glow footer-glow--blue" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════
       CONTENU PRINCIPAL DU FOOTER
       ═══════════════════════════════════════════ -->
  <div class="footer-container">

    <!-- COLONNE 1 : IDENTITÉ & MARQUE -->
    <div class="footer-brand">
      <a routerLink="/" class="brand-logo" aria-label="Retour à l'accueil">
        <span class="logo-icon-wrapper">
          <span class="logo-icon" aria-hidden="true">🎸</span>
        </span>
        <div class="logo-text-wrapper">
          <span class="logo-text">CHARLY</span>
          <span class="logo-text accent">GUITARE</span>
        </div>
      </a>

     

      <!-- Mention site 100% payant -->
      <p class="paid-badge">
        🔒  Accès aux cours, jeux et contenus premium via abonnement.
      </p>

      <!-- Réseaux Sociaux -->
      <div class="social-links" aria-label="Réseaux sociaux">
        <a href="https://www.youtube.com/@CharlyGuitare" target="_blank" rel="noopener noreferrer"
           aria-label="YouTube — Charly Guitare" class="social-link social-youtube">
          <img src="assets/youtube.png" alt="" class="social-img" loading="lazy" />
        </a>
        <a href="https://facebook.com/charlyguitare2020" target="_blank" rel="noopener noreferrer"
           aria-label="Facebook — Charly Guitare" class="social-link social-facebook">
          <img src="assets/facebook.png" alt="" class="social-img" loading="lazy" />
        </a>
        <a href="https://www.instagram.com/charlyguitare" target="_blank" rel="noopener noreferrer"
           aria-label="Instagram — Charly Guitare" class="social-link social-instagram">
          <img src="assets/instagram.png" alt="" class="social-img" loading="lazy" />
        </a>
      </div>
    </div>

    <!-- COLONNE 2 : NAVIGATION -->
    <nav class="footer-column" aria-label="Navigation pied de page">
      <h4 class="column-title">Navigation</h4>
      <div class="footer-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
        <a routerLink="/user/accueil" routerLinkActive="active">Qui est Charly ?</a>
        <a routerLink="/user/again" routerLinkActive="active">La Dream Team</a>
      </div>
    </nav>

    <!-- COLONNE 3 : INFORMATIONS LÉGALES -->
    <nav class="footer-column" aria-label="Informations légales">
      <h4 class="column-title">Informations</h4>
      <div class="footer-nav">
        <a routerLink="/legal/mentions" routerLinkActive="active">Mentions légales</a>
        <a routerLink="/legal/confidentialite" routerLinkActive="active">Confidentialité</a>
        <a routerLink="/legal/cgv" routerLinkActive="active">Conditions Générales de Vente</a>
        <a routerLink="/legal/aide" routerLinkActive="active">Aide & Contact</a>
      </div>
 
    </nav>

  </div>

  <!-- ═══════════════════════════════════════════
       BARRE INFÉRIEURE
       ═══════════════════════════════════════════ -->
  <div class="footer-bottom">
    <div class="bottom-container">

      <p class="copyright">
        &copy; {{ currentYear }} <strong class="brand-highlight">CHARLY GUITARE</strong>. Tous droits réservés.
     
      </p>

      

    </div>
  </div>

</footer>
<br /><br /><br /><br /><br />
