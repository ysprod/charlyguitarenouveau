<!-- src/app/auth/login/login.component.html -->

<app-auth-layout>
  <app-auth-header
    title="Bienvenue"
    subtitle="Connectez-vous pour accéder à votre espace personnel."
    promptText="Pas encore de compte ?"
    linkLabel="Créer un compte"
    linkRoute="/register"
    [returnUrl]="returnUrl()"
  />

  @if (errorMessage()) {
    <app-auth-alert type="error" [message]="errorMessage()" />
  }

  @if (successMessage()) {
    <app-auth-alert type="success" [message]="successMessage()" />
  }

  <app-google-button
    label="Continuer avec Google"
    [disabled]="loading()"
    (clicked)="loginWithGoogle()"
  />

  <div class="divider">
    <span>ou avec votre e-mail</span>
  </div>

  <form
    (ngSubmit)="handleSubmit()"
    novalidate
    [attr.aria-busy]="loading()"
  >
    <app-auth-input
      inputId="email"
      label="Adresse e-mail"
      placeholder="votre@email.com"
      type="email"
      autocomplete="email"
      icon="email"
      [disabled]="loading()"
      [(value)]="email"
    />

    <app-auth-input
      inputId="password"
      label="Mot de passe"
      placeholder="••••••••"
      type="password"
      autocomplete="current-password"
      icon="lock"
      [disabled]="loading()"
      [withPasswordToggle]="true"
      [(value)]="password"
      [(showPassword)]="showPassword"
    />

    <div class="forgot-password">
      <button
        type="button"
        class="btn-link"
        (click)="onForgotPassword()"
        [disabled]="loading()"
      >
        Mot de passe oublié ?
      </button>
    </div>

    <button
      type="submit"
      class="btn-submit"
      [disabled]="loading()"
      [attr.aria-busy]="loading()"
    >
      @if (!loading()) {
        <span class="btn-content">
          Se connecter
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M5 12h14M12 5l7 7-7 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      } @else {
        <span class="btn-content">
          <span class="spinner" aria-hidden="true"></span>
          Connexion...
        </span>
      }
    </button>
  </form>
</app-auth-layout>
