<!-- src/app/home/again/again.component.html -->

<div class="equipe-container">

  <!-- SECTION FEATURED (Les Piliers) -->
  <section class="featured-section" aria-labelledby="piliers-title">
    <h2 id="piliers-title" class="section-title">
      <span class="material-icons" aria-hidden="true">stars</span>
      LA DREAM TEAM
    </h2>

    <div class="featured-grid">
      @for (membre of membresFeatured; track membre.nom) {
        <article
          class="featured-card"
          [style.--accent]="membre.couleur"
        >
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-icon" aria-hidden="true">{{ membre.icone }}</div>
          <div class="card-role">{{ membre.role }}</div>
          <div class="card-name">{{ membre.nom }}</div>
          <div class="card-decoration" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </article>
      }
    </div>
  </section>

  <br><br>

  <!-- SECTION GRILLE -->
  <section class="team-section" aria-labelledby="gardiens-title">

    <div class="team-grid">
      @for (membre of membresStandard; track membre.nom) {
        <article
          class="member-card"
          [class.anonymous]="membre.anonyme"
          [style.--accent]="membre.couleur"
        >
          <div class="member-icon-wrapper">
            <div class="member-icon" aria-hidden="true">{{ membre.icone }}</div>
            <div class="icon-ring" aria-hidden="true"></div>
          </div>

          <div class="member-info">
            <span class="member-role">{{ membre.role }}</span>
            <span class="member-name" [class.mystery]="membre.anonyme">
              {{ membre.nom }}
            </span>
          </div>

          @if (membre.anonyme) {
            <div class="member-badge" aria-label="Membre anonyme">
              <span class="material-icons" aria-hidden="true">visibility_off</span>
            </div>
          }
        </article>
      }
    </div>
  </section>

</div>
