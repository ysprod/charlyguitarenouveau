<!-- src/app/auth/register/register.component.html -->

<app-auth-layout>
  <app-auth-header
    title="Créer un compte"
    subtitle="Rejoignez l'Académie et commencez votre parcours dès aujourd'hui."
    promptText="Déjà membre ?"
    linkLabel="Se connecter"
    linkRoute="/login"
    [returnUrl]="returnUrl()"
  />

  @if (errorMessage()) {
    <app-auth-alert type="error" [message]="errorMessage()" />
  }

  @if (successMessage()) {
    <app-auth-alert type="success" [message]="successMessage()" />
  }

  <app-google-button
    label="S'inscrire avec Google"
    [disabled]="loading()"
    (clicked)="signUpWithGoogle()"
  />

  <div class="divider">
    <span>ou avec votre e-mail</span>
  </div>

  <form
    (ngSubmit)="handleSubmit()"
    novalidate
    [attr.aria-busy]="loading()"
  >
    <app-auth-input
      inputId="email"
      label="Adresse e-mail"
      placeholder="votre@email.com"
      type="email"
      autocomplete="email"
      icon="email"
      [disabled]="loading()"
      [(value)]="email"
    />

    <app-auth-input
      inputId="password"
      label="Mot de passe"
      placeholder="••••••••"
      type="password"
      autocomplete="new-password"
      icon="lock"
      [disabled]="loading()"
      [withPasswordToggle]="true"
      [(value)]="password"
      [(showPassword)]="showPassword"
    />

    <app-auth-input
      inputId="confirmPassword"
      label="Confirmer le mot de passe"
      placeholder="••••••••"
      type="password"
      autocomplete="new-password"
      icon="check"
      [disabled]="loading()"
      [withPasswordToggle]="true"
      [(value)]="confirmPassword"
      [(showPassword)]="showConfirmPassword"
    />

    <button
      type="submit"
      class="btn-submit"
      [disabled]="!canSubmit()"
      [attr.aria-busy]="loading()"
    >
      @if (!loading()) {
        <span class="btn-content">
          Créer mon compte
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M5 12h14M12 5l7 7-7 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      } @else {
        <span class="btn-content">
          <span class="spinner" aria-hidden="true"></span>
          Création en cours...
        </span>
      }
    </button>
  </form>
</app-auth-layout>
