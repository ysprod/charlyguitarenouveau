<!-- src/app/home/install-prompt/install-prompt.component.html -->

@if (visible()) {
  <div
    class="install-banner"
    role="region"
    aria-labelledby="install-banner-title"
    aria-describedby="install-banner-desc"
  >
    <div class="banner-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="3"/>
        <path d="M12 18h.01"/>
      </svg>
    </div>

    <div class="banner-text">
      <h3 id="install-banner-title" class="banner-title">
        Installe l'app Charly Guitare
      </h3>
      <p id="install-banner-desc" class="banner-subtitle">
        Accès rapide depuis ton écran d'accueil.
      </p>
    </div>

    <div class="banner-actions">
      <button
        type="button"
        class="btn-install"
        (click)="install()"
        [disabled]="installing()"
        [attr.aria-busy]="installing()"
      >
        @if (!installing()) {
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Installer</span>
        } @else {
          <span class="spinner" aria-hidden="true"></span>
          <span>Installation…</span>
        }
      </button>

      <button
        type="button"
        class="btn-close"
        (click)="dismiss()"
        aria-label="Fermer la bannière d'installation"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
}
