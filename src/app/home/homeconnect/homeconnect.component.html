<!-- src/app/home/homeconnect/homeconnect.component.html -->

<div class="landing-page">

  <div class="hero-inner">

    <!-- Podcast Vidéo -->
    <app-podcastvideo [randommode]="true" [affichebouton]="true" />

    <!-- ✅ NOUVEAUX BOUTONS "WAHOU" -->
    <nav class="hero-actions" aria-label="Actions rapides">
      @for (action of quickActions; track action.route) {
        <a [routerLink]="action.route" 
           class="action-card" 
           [attr.data-color]="action.color"
           [attr.aria-label]="action.label">
          
          <!-- Effet de lueur au survol -->
          <span class="action-glow" aria-hidden="true"></span>
          
          <!-- Icône -->
          <span class="action-icon-wrapper">
            <span class="action-icon" aria-hidden="true">{{ action.icon }}</span>
          </span>
          
          <!-- Contenu -->
          <span class="action-content">
            <span class="action-label">{{ action.label }}</span>
          </span>

          <!-- Flèche -->
          <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
      }
    </nav>

    <!-- Boîte de réception -->
    <app-inbox-panel />
    
    <!-- Carrousel -->
    <app-immersive-carousel />
  </div> 
  
  <app-footer />
</div>
