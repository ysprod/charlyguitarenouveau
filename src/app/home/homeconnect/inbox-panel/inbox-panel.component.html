<!-- src/app/home/homeconnect/inbox-panel/inbox-panel.component.html -->

<section class="inbox-section" aria-labelledby="inbox-title">

  <!-- ═══════════════════════════════════════════════════════
       EN-TÊTE
       ═══════════════════════════════════════════════════════ -->
  <header class="inbox-header">
    <div class="inbox-title-wrapper">
      <span class="inbox-eyebrow">MESSAGERIE</span>
      <h2 id="inbox-title" class="inbox-title">
        Boîte de réception
        @if (unreadCount() > 0) {
          <span class="inbox-unread-badge" aria-label="messages non lus">
            {{ unreadCount() }}
          </span>
        }
      </h2>
    </div>

    <div class="inbox-header-actions">
      <a routerLink="/contact"
         class="inbox-btn inbox-btn-orange"
         aria-label="Créer un nouveau message">
        <span aria-hidden="true">✉️</span>
        Nouveau message
      </a>

      <a routerLink="/inbox"
         class="inbox-btn inbox-btn-blue"
         aria-label="Ouvrir la messagerie complète">
        <span aria-hidden="true">📬</span>
        Ouvrir la messagerie
      </a>
    </div>
  </header>
</section>
