<!-- src/app/live/live.component.html -->

<div class="live-hub-container">

  <!-- ═══════════════════════════════════════════════════════
       HERO BANNER
       ═══════════════════════════════════════════════════════ -->
  <section class="hero-banner" aria-labelledby="live-hero-title">
    <div class="hero-grid-bg" aria-hidden="true"></div>
    <div class="hero-glow" aria-hidden="true"></div>

    <div class="hero-content">
      <div class="live-badge">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span>LES LIVES DE</span>
      </div>

      <h1 id="live-hero-title" class="hero-title">
        <span class="title-main">CHARLY GUITARE</span>
      </h1>

      <p class="hero-description">
        Suivez les performances en direct
        et réécoutez vos sessions préférées.
      </p>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       GRILLE DE CARTES
       ═══════════════════════════════════════════════════════ -->
  <section class="grid-section" aria-label="Contenus live">

    <!-- 🎥 CARTE VIDÉO ENRICHIE -->
    <div class="video-card">
      <div class="video-header">
        <span class="live-badge-card">
          <span class="dot-live" aria-hidden="true"></span>
          {{ video.badge }}
        </span>
        <h3>{{ video.title }}</h3>
      </div>

      <div class="video-wrapper">
        <iframe
          [src]="safeEmbedUrl()"
          title="Vidéo de présentation Charly Guitare"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>

      <div class="video-footer">
        <a
          [href]="video.watchUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="yt-link-btn"
        >
          <span class="icon" aria-hidden="true">▶</span>
          <span>Regarder sur YouTube</span>
        </a>
      </div>
    </div>

    <!-- 🎤 CARTES SECONDAIRES -->
    @for (card of cards; track card.id) {
      <article [class]="'live-card ' + card.cssClass">
        <div class="card-content">
          <div class="card-icon-wrap">
            <span class="card-icon" aria-hidden="true">{{ card.icon }}</span>
          </div>
          <h3>{{ card.title }}</h3>
          <p>{{ card.description }}</p>
        </div>

        <a
          [href]="card.actionUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="card-action"
        >
          <span>{{ card.actionLabel }}</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </article>
    }

  </section>
</div>
