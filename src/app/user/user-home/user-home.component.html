<!-- src/app/user/user-home/user-home.component.html -->

<div class="user-home-container">

  <!-- Hero avec profil -->
  <section class="hero-welcome">
    <div class="hero-orb hero-orb--gold" aria-hidden="true"></div>
    <div class="hero-orb hero-orb--blue" aria-hidden="true"></div>

    <div class="hero-inner">
      <app-podcastvideo [randommode]="true" [affichebouton]="false" />

      <nav class="hero-actions" aria-label="Actions rapides">
        @for (action of quickActions; track action.route) {
        <a [routerLink]="action.route" class="action-card" [attr.data-color]="action.color"
          [attr.aria-label]="action.label">
          <span class="action-icon" aria-hidden="true">{{ action.icon }}</span>
          <span class="action-label">{{ action.label }}</span>
          <svg class="action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </a>
        }
      </nav>

      <app-inbox-panel />
      <app-immersive-carousel />
    </div>
  </section>

  <app-footer />
</div>
