<div
  class="victory-dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="victory-title"
  aria-describedby="victory-message"
>

  <!-- En-tête : emoji + titre -->
  <header class="dialog-header">
    <div class="emoji-badge" aria-hidden="true">🎉</div>
    <h2 id="victory-title" class="dialog-title">
      Félicitations !
    </h2>
  </header>

  <!-- Contenu : message + sous-message -->
  <div class="dialog-content">
    <p id="victory-message" class="dialog-message">
      Vous avez gagné !
    </p>
    <p class="dialog-submessage">
      Toutes les paires ont été trouvées. Bravo, offolandais !
    </p>
  </div>

  <!-- Actions : Retour (gris) + Rejouer (orange) -->
  <footer class="dialog-actions">

    <button
      type="button"
      class="btn btn-secondary"
      (click)="goToMenu()"
      aria-label="Retourner au menu des jeux"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        aria-hidden="true"
      >
        <line x1="19" y1="12" x2="5" y2="12" />
        <polyline points="12 19 5 12 12 5" />
      </svg>
      <span>Retour au menu</span>
    </button>

    <button
      #replayBtn
      type="button"
      class="btn btn-primary"
      (click)="replay()"
      aria-label="Rejouer une nouvelle partie"
    >
      <span class="btn-emoji" aria-hidden="true">🔄</span>
      <span>Rejouer</span>
    </button>

  </footer>

</div>
