<!-- src/app/game/lykomode/lykomode.component.html -->

<div class="lyko-page">

  <!-- ═══════════════════════════════════════════════════════
       BOÎTE DE DIALOGUE
       ═══════════════════════════════════════════════════════ -->
  <div
    class="dialog-overlay"
    [class.show]="showDialog()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lyko-title"
    (keydown.escape)="backToMenu()"
  >

    <div class="dialog-card">

      <!-- Ornement haut -->
      <div class="dialog-ornament top" aria-hidden="true"></div>

      <!-- Avatar Lykö -->
      <div class="lyko-avatar" aria-hidden="true">
        <div class="avatar-ring ring-1"></div>
        <div class="avatar-ring ring-2"></div>
        <div class="avatar-icon">🐵</div>
        <div class="avatar-sparkle s1">✨</div>
        <div class="avatar-sparkle s2">⚡</div>
      </div>

      <!-- Titre -->
      <h1 id="lyko-title" class="lyko-title">
        <span class="title-small">Gardien des Guitares Sacrées</span>
        <span class="title-big">LYKÖ LE SAGE</span>
        <span class="title-underline" aria-hidden="true"></span>
      </h1>

      <!-- Boutons d'action -->
      <div class="actions">

        <!-- 🟠 Défier OFFOWA (action principale) -->
        <button
          #primaryBtn
          type="button"
          class="btn-action btn-primary"
          (click)="playAgainstAI()"
          aria-label="Défier OFFOWA, l'intelligence artificielle"
        >
          <span class="btn-glow" aria-hidden="true"></span>
          <span class="btn-icon" aria-hidden="true">🤖</span>
          <span class="btn-content">
            <span class="btn-text">DÉFIER OFFOWA</span>
            <span class="btn-sub">Affronte la sagesse du Gardien</span>
          </span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>

        <!-- 🔵 Jouer avec un ami (action alternative) -->
        <button
          type="button"
          class="btn-action btn-secondary"
          (click)="playWithFriend()"
          aria-label="Jouer avec un ami en local"
        >
          <span class="btn-glow" aria-hidden="true"></span>
          <span class="btn-icon" aria-hidden="true">👥</span>
          <span class="btn-content">
            <span class="btn-text">JOUER AVEC UN AMI</span>
            <span class="btn-sub">Duel local · 2 joueurs</span>
          </span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>

        <!-- ⚪ Retour au menu (action secondaire) -->
        <button
          type="button"
          class="btn-action btn-neutral"
          (click)="backToMenu()"
          aria-label="Retourner au menu des jeux"
        >
          <span class="btn-glow" aria-hidden="true"></span>
          <span class="btn-icon" aria-hidden="true">↩</span>
          <span class="btn-content">
            <span class="btn-text">MENU DES JEUX</span>
            <span class="btn-sub">Revenir à l'arène principale</span>
          </span>
          <span class="btn-arrow" aria-hidden="true">←</span>
        </button>

      </div>

      <!-- Ornement bas -->
      <div class="dialog-ornament bottom" aria-hidden="true"></div>

    </div>
  </div>

</div>
