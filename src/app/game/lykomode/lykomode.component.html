<div class="lyko-page">

  <!-- ============================================================
       DÉCOR ANIMÉ
       ============================================================ -->
  <div class="bg-decor" aria-hidden="true">
    <div class="glow glow-primary"></div>
    <div class="glow glow-secondary"></div>
    <div class="magic-grid"></div>
    <div class="aurora"></div>

    <!-- Particules -->
    <div class="particles">
      <span class="particle"
            *ngFor="let p of particles"
            [style.left.%]="p.left"
            [style.animation-delay.s]="p.delay"
            [style.animation-duration.s]="p.duration"
            [style.width.px]="p.size"
            [style.height.px]="p.size"
            [style.background]="p.color"
            [style.box-shadow]="'0 0 10px ' + p.color"></span>
    </div>

    <!-- Runes -->
    <div class="runes">
      <span class="rune"
            *ngFor="let r of runes"
            [style.left.%]="r.left"
            [style.top.%]="r.top"
            [style.animation-delay.s]="r.delay"
            [style.animation-duration.s]="r.duration">{{ r.symbol }}</span>
    </div>
  </div>

  <!-- ============================================================
       BOÎTE DE DIALOGUE
       ============================================================ -->
  <div class="dialog-overlay" [class.show]="showDialog">

    <div class="dialog-card">

      <!-- Ornement haut -->
      <div class="dialog-ornament top"></div>

      <!-- Badge -->
      <div class="dialog-badge">
        <span class="badge-dot"></span>
        <span>Carré Chinois</span>
      </div>

      <!-- Avatar Lyko -->
      <div class="lyko-avatar">
        <div class="avatar-ring ring-1"></div>
        <div class="avatar-ring ring-2"></div>
        <div class="avatar-icon">🐵</div>
        <div class="avatar-sparkle s1">✨</div>
        <div class="avatar-sparkle s2">⚡</div>
      </div>

      <!-- Titre -->
      <h1 class="lyko-title">
        <span class="title-small">Le Gardien des Guitares Sacrées</span>
        <span class="title-big">LYKÖ LE SAGE</span>
        <span class="title-underline"></span>
      </h1> 

      <!-- Boutons d'action -->
      <div class="actions">

        <!-- Jouer contre l'IA (Bouton Vedette) -->
        <button type="button" class="btn-action btn-ia" (click)="playAgainstAI()">
          <span class="btn-glow"></span>
          <span class="btn-icon">🤖</span>
          <span class="btn-content">
            <span class="btn-text">DÉFIER LYKO (IA)</span>
            <span class="btn-sub">Affronte la sagesse du Gardien</span>
          </span>
          <span class="btn-arrow">→</span>
        </button>

        <!-- Jouer avec un ami -->
        <button type="button" class="btn-action btn-friend" (click)="playWithFriend()">
          <span class="btn-glow"></span>
          <span class="btn-icon">👥</span>
          <span class="btn-content">
            <span class="btn-text">JOUER AVEC UN AMI</span>
            <span class="btn-sub">Duel local · 2 Joueurs</span>
          </span>
          <span class="btn-arrow">→</span>
        </button>

        <!-- Retour au menu -->
        <button type="button" class="btn-action btn-back" (click)="backToMenu()">
          <span class="btn-glow"></span>
          <span class="btn-icon">↩</span>
          <span class="btn-content">
            <span class="btn-text">MENU DES JEUX</span>
            <span class="btn-sub">Revenir à l'arène principale</span>
          </span>
          <span class="btn-arrow">←</span>
        </button>

      </div>

      <!-- Ornement bas -->
      <div class="dialog-ornament bottom"></div>

    </div>
  </div>

</div>
