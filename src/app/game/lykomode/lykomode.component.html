<div class="lyko-page">
  <main class="lyko-shell" aria-labelledby="lyko-main-title">

    <section class="hero" aria-labelledby="lyko-main-title">
      <div class="hero-figure">
        <img src="assets/lyko.jpg" alt="Lyko le Sage, gardien des savoirs oubliés d'OFFOLAND" class="hero-image"
          loading="eager" fetchpriority="high" />
        <span class="hero-badge" aria-hidden="true">OXO</span>
      </div>

      <div class="hero-text">
        <h1 id="lyko-main-title" class="hero-title">LYKO LE SAGE</h1>
        <p class="hero-intro">
          Essaie de me défier ou joue avec un ami !
        </p>
      </div>
    </section>

    <section class="play-actions" aria-labelledby="play-actions-title">
      <h2 id="play-actions-title" class="section-title">
        Choisis ton mode de jeu
      </h2>

      <div class="actions">
        <!-- 🟠 Défier OFFOWA -->
        <button #primaryBtn type="button" class="btn-action btn-primary" (click)="playAgainstAI()"
          aria-label="Défier LYKO, l'intelligence artificielle">
          <span class="btn-icon" aria-hidden="true">🤖</span>
          <span class="btn-content">
            <span class="btn-text">DÉFIER LYKO</span>
            <span class="btn-sub">Affronte la haute sagesse du Gardien</span>
          </span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>

        <!-- 🔵 Jouer avec un ami -->
        <button type="button" class="btn-action btn-secondary" (click)="playWithFriend()"
          aria-label="Jouer avec un ami en duel local à deux joueurs">
          <span class="btn-icon" aria-hidden="true">👥</span>
          <span class="btn-content">
            <span class="btn-text">JOUER AVEC UN AMI</span>
            <span class="btn-sub">Duel local · 2 joueurs</span>
          </span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>

      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════
         TUTORIEL
         ═══════════════════════════════════════════════════════ -->
    <section class="tutorial-panel" aria-labelledby="tutorial-title">
      <h2 id="tutorial-title" class="section-title">Besoin d'un coup de main ?</h2>

      <button type="button" class="tutorial" (click)="showTutorial()"
        aria-label="Ouvrir le tutoriel vidéo de Lyko le Sage sur YouTube (nouvel onglet)">
        <span class="tutorial-monkey" aria-hidden="true">🐵</span>
        <span class="tutorial-content">
          <strong>TUTORIEL</strong>
          <small>Découvre le jeu en vidéo</small>
        </span>
        <span class="play-icon" aria-hidden="true">▶</span>
      </button>
    </section>

    <section class="info-grid" aria-labelledby="about-title">
      <article class="panel about">
        <h2 id="about-title">
          <span aria-hidden="true">🌟</span>
          À propos
        </h2>
        <p>
          Lyko invoque la puissance d'offowa pour l'aider à gagner ses adversaires et gagner son respect.
        </p>
        <p class="wisdom">Farce ou Sagesse ??</p>
        <span class="paw" aria-hidden="true">🐾</span>
      </article>
    </section> 
  </main>
</div>
