<div class="lyko-page">
 
  <!-- ═══════════════════════════════════════════════════════
       BOÎTE DE DIALOGUE
       ═══════════════════════════════════════════════════════ -->
  <div class="dialog-overlay" [class.show]="showDialog()">

    <div class="dialog-card">

      <!-- Ornement haut -->
      <div class="dialog-ornament top"></div>
 
      <!-- Avatar Lyko -->
      <div class="lyko-avatar">
        <div class="avatar-ring ring-1"></div>
        <div class="avatar-ring ring-2"></div>
        <div class="avatar-icon">🐵</div>
        <div class="avatar-sparkle s1">✨</div>
        <div class="avatar-sparkle s2">⚡</div>
      </div>

      <!-- Titre -->
      <h1 class="lyko-title">
        <span class="title-small">Le Gardien des Guitares Sacrées</span>
        <span class="title-big">LYKÖ LE SAGE</span>
        <span class="title-underline"></span>
      </h1>

      <!-- Boutons d'action -->
      <div class="actions">

        <!-- 🔥 Défier OFFOWA -->
        <button type="button" class="btn-action btn-ia" (click)="playAgainstAI()">
          <span class="btn-glow"></span>
          <span class="btn-icon">🤖</span>
          <span class="btn-content">
            <span class="btn-text">DÉFIER OFFOWA</span>
            <span class="btn-sub">Affronte la sagesse du Gardien</span>
          </span>
          <span class="btn-arrow">→</span>
        </button>

        <!-- 👥 Jouer avec un ami -->
        <button type="button" class="btn-action btn-friend" (click)="playWithFriend()">
          <span class="btn-glow"></span>
          <span class="btn-icon">👥</span>
          <span class="btn-content">
            <span class="btn-text">JOUER AVEC UN AMI</span>
            <span class="btn-sub">Duel local · 2 Joueurs</span>
          </span>
          <span class="btn-arrow">→</span>
        </button>

        <!-- ↩ Retour au menu -->
        <button type="button" class="btn-action btn-back" (click)="backToMenu()">
          <span class="btn-glow"></span>
          <span class="btn-icon">↩</span>
          <span class="btn-content">
            <span class="btn-text">MENU DES JEUX</span>
            <span class="btn-sub">Revenir à l'arène principale</span>
          </span>
          <span class="btn-arrow">←</span>
        </button>

      </div>

      <!-- Ornement bas -->
      <div class="dialog-ornament bottom"></div>

    </div>
  </div>

</div>
