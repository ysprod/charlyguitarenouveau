<!-- src/app/game/play/play.component.html -->

<div class="game-dashboard-container">

  <div class="main-game-area">

    <!-- ═══════════════════════════════════════════════════════
         TOAST
         ═══════════════════════════════════════════════════════ -->
    @if (toastMessage()) {
      <div
        class="toast-banner"
        [class.toast-success]="toastType() === 'success'"
        [class.toast-error]="toastType() === 'error'"
        role="status"
        aria-live="polite"
      >
        {{ toastMessage() }}
      </div>
    }

    <!-- ═══════════════════════════════════════════════════════
         GRILLE DES JEUX
         ═══════════════════════════════════════════════════════ -->
    <section class="games-selector-section" aria-label="Liste des jeux">

      @if (visibleGameCount() === 0) {
        <div class="empty-state">
          <span class="empty-icon" aria-hidden="true">🎸</span>
          <p>Aucun jeu dans cette catégorie pour le moment...</p>
        </div>
      } @else {
        <div class="game-buttons-grid">
          @for (game of visibleGames(); track game.id) {
            <button
              type="button"
              class="btn-game"
              [class]="game.btnClass"
              (click)="tryLaunchGame(game)"
              [attr.aria-label]="'Lancer ' + game.title"
            >
              <!-- Halo coloré -->
              <span class="btn-glow" aria-hidden="true"></span>

              <!-- Icône -->
              <span class="btn-icon" aria-hidden="true">{{ game.icon }}</span>

              <!-- Contenu -->
              <span class="btn-content">
                <span class="btn-text">{{ game.title }}</span>
                <span class="btn-sub">{{ game.subtitle }}</span>
              </span>

              <!-- Flèche -->
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>

              <!-- Coins décoratifs -->
              <span class="corner corner-tl" aria-hidden="true"></span>
              <span class="corner corner-tr" aria-hidden="true"></span>
              <span class="corner corner-bl" aria-hidden="true"></span>
              <span class="corner corner-br" aria-hidden="true"></span>
            </button>
          }
        </div>
      }
    </section>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       MODALE CODE PROMO
       ═══════════════════════════════════════════════════════ -->
  @if (showPromoModal()) {
    <app-promo-modal
      [isSaving]="isSavingPromo()"
      [errorMessage]="promoError()"
      title="Code Promo obligatoire"
      message="Pour accéder, saisissez un code promo valide, puis cliquez sur Continuer."
      (codeSubmitted)="onPromoCodeSubmitted($event)"
      (closed)="closePromoModal()"
    />
  }

</div>
