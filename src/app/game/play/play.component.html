<!-- src/app/game/play/play.component.html -->

<div class="game-dashboard-container">

  <div class="main-game-area">

    <!-- ═══════════════════════════════════════════════════════
         HERO HEADER
         ═══════════════════════════════════════════════════════ -->
    <header class="hero-header">
      <div class="hero-badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span>APPRENDRE EN JOUANT</span>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════
         TOAST (succès / erreur)
         ═══════════════════════════════════════════════════════ -->
    @if (toastMessage()) {
      <div
        class="toast-banner"
        [class.toast-success]="toastType() === 'success'"
        [class.toast-error]="toastType() === 'error'"
        role="status"
      >
        {{ toastMessage() }}
      </div>
    }

    <!-- ═══════════════════════════════════════════════════════
         FILTRES
         ═══════════════════════════════════════════════════════ -->
    <div class="filter-bar" role="tablist" aria-label="Filtrer les jeux">
      @for (f of filters; track f.id) {
        <button
          type="button"
          role="tab"
          class="filter-chip"
          [class.active]="selectedFilter() === f.id"
          [attr.aria-selected]="selectedFilter() === f.id"
          (click)="selectFilter(f.id)"
          [attr.aria-label]="'Filtrer : ' + f.label"
        >
          <span class="chip-icon" aria-hidden="true">{{ f.icon }}</span>
          <span class="chip-label">{{ f.label }}</span>
        </button>
      }
    </div>

    <!-- ═══════════════════════════════════════════════════════
         GRILLE DE JEUX
         ═══════════════════════════════════════════════════════ -->
    <section class="games-selector-section" aria-label="Liste des jeux">

      @if (visibleGameCount() === 0) {
        <div class="empty-state">
          <span class="empty-icon" aria-hidden="true">🎸</span>
          <p>Aucun jeu dans cette catégorie pour le moment...</p>
        </div>
      } @else {
        <div class="game-buttons-grid">
          @for (game of visibleGames(); track game.id) {
            <button
              type="button"
              class="btn-game"
              [class]="game.btnClass"
              (click)="tryLaunchGame(game)"
              [attr.aria-label]="'Lancer ' + game.title"
            >
              <span class="btn-glow" aria-hidden="true"></span>
              <span class="btn-border-anim" aria-hidden="true"></span>
              <span class="btn-icon" aria-hidden="true">{{ game.icon }}</span>
              <span class="btn-content">
                <span class="btn-tag" [class]="game.tagClass">{{ game.tag }}</span>
                <span class="btn-text">{{ game.title }}</span>
                <span class="btn-sub">{{ game.subtitle }}</span>
              </span>
              <span class="btn-arrow" aria-hidden="true">→</span>
              <span class="corner corner-tl" aria-hidden="true"></span>
              <span class="corner corner-tr" aria-hidden="true"></span>
              <span class="corner corner-bl" aria-hidden="true"></span>
              <span class="corner corner-br" aria-hidden="true"></span>
            </button>
          }
        </div>
      }
    </section>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       🎁 MODALE CODE PROMO — Composant réutilisable
       ═══════════════════════════════════════════════════════ -->
  @if (showPromoModal()) {
    <app-promo-modal
      [isSaving]="isSavingPromo()"
      [errorMessage]="promoError()"
      title="Code Promo obligatoire"
      message="Pour accéder, saisissez un code promo valide, puis cliquez sur Continuer."
      (codeSubmitted)="onPromoCodeSubmitted($event)"
      (closed)="closePromoModal()"
    />
  }

</div>
