@if (toast().show) {
  <div
    class="toast-notification"
    [class]="toast().type"
    role="status"
    aria-live="polite"
  >
    <span class="toast-icon" aria-hidden="true">
      @switch (toast().type) {
        @case ('success') { ✅ }
        @case ('error')   { ⚠️ }
        @default          { ℹ️ }
      }
    </span>
    <span class="toast-message">{{ toast().message }}</span>
  </div>
}
