<header class="card-header">
  <h2>{{ title() }}</h2>

  <div class="toggle-mode">
    <span>{{ promptText() }}</span>
    <a
      [routerLink]="[linkRoute()]"
      [queryParams]="{ returnUrl: returnUrl() }"
      class="btn-link-highlight"
    >
      {{ linkLabel() }}
    </a>
  </div>

  <p class="subtitle">{{ subtitle() }}</p>
</header>
