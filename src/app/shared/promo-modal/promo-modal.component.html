<!-- src/app/shared/promo-modal/promo-modal.component.html -->

<div
  class="promo-modal-backdrop"
  role="dialog"
  aria-modal="true"
  aria-labelledby="promo-modal-title"
  aria-describedby="promo-modal-desc"
  (click)="close()"
>
  <div class="promo-modal-card" (click)="$event.stopPropagation()">

    <div class="promo-modal-icon" aria-hidden="true">🎁</div>

    <h2 id="promo-modal-title" class="promo-modal-title">
      {{ title() }}
    </h2>

    <p id="promo-modal-desc" class="promo-modal-message">
      {{ message() }}
    </p>

    <div class="promo-modal-field">
      <label for="promoCodeInput">Votre code promo</label>
      <input
        #codeInput
        type="text"
        id="promoCodeInput"
        name="promoCodeInput"
        [ngModel]="codeValue()"
        (ngModelChange)="codeValue.set($event)"
        (keydown.enter)="submit(); $event.preventDefault()"
        autocomplete="off"
        maxlength="50"
        [disabled]="isSaving()"
      />
      <small class="promo-modal-hint">
        Ce code est obligatoire.
      </small>
    </div>

    @if (errorMessage()) {
      <p class="promo-modal-error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="promo-modal-actions">
      <button
        type="button"
        class="promo-btn promo-btn-secondary"
        (click)="close()"
        [disabled]="isSaving()"
      >
        Annuler
      </button>

      <button
        type="button"
        class="promo-btn promo-btn-primary"
        (click)="submit()"
        [disabled]="isSaving()"
        [attr.aria-busy]="isSaving()"
      >
        @if (!isSaving()) {
          <span>Continuer</span>
        } @else {
          <span class="spinner" aria-hidden="true"></span>
          <span>Vérification...</span>
        }
      </button>
    </div>

  </div>
</div>
