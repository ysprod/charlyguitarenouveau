<!-- src/app/shared/promo-modal/promo-modal.component.html -->

<div
  class="promo-modal-backdrop"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descId"
  (click)="close()"
>
  <div #cardRef class="promo-modal-card" (click)="$event.stopPropagation()">

    <div class="promo-modal-icon" aria-hidden="true">🎁</div>

    <h2 [id]="titleId" class="promo-modal-title">
      {{ title() }}
    </h2>

    <p [id]="descId" class="promo-modal-message">
      {{ message() }}
    </p>

    <div class="promo-modal-field">
      <label [for]="inputId">Votre code promo</label>
      <input
        #codeInput
        type="text"
        [id]="inputId"
        name="promoCodeInput"
        [ngModel]="codeValue()"
        (ngModelChange)="onCodeChange($event)"
        (keydown.enter)="submit(); $event.preventDefault()"
        autocomplete="off"
        maxlength="50"
        [disabled]="isSaving()"
        placeholder="Ex : GUITARE2026"
        aria-required="true"
      />
      <small class="promo-modal-hint">
        Ce code est obligatoire pour finaliser l'achat.
      </small>
    </div>

    @if (errorMessage()) {
      <p class="promo-modal-error" role="alert" aria-live="assertive">
        {{ errorMessage() }}
      </p>
    }

    <div class="promo-modal-actions">
      <button
        type="button"
        class="promo-btn promo-btn-secondary"
        (click)="close()"
        [disabled]="isSaving()"
      >
        Annuler
      </button>

      <button
        type="button"
        class="promo-btn promo-btn-primary"
        (click)="submit()"
        [disabled]="isSaving() || !canSubmit()"
        [attr.aria-busy]="isSaving()"
      >
        @if (!isSaving()) {
          <span>Continuer</span>
        } @else {
          <span class="spinner" aria-hidden="true"></span>
          <span>Vérification...</span>
        }
      </button>
    </div>

  </div>
</div>
